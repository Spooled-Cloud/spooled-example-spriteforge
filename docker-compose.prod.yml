# ===========================================
# SPRITEFORGE - PRODUCTION DEPLOYMENT
# ===========================================
#
# Deploy via Portainer, Docker Compose, or any container orchestrator.
# Images are automatically built by GitHub Actions for amd64 and arm64.
#
# Quick start:
#   1. Copy .env.example to .env and configure
#   2. docker compose -f docker-compose.prod.yml up -d
#
# For Portainer:
#   1. Create a new Stack
#   2. Upload this file or paste contents
#   3. Add environment variables in the Portainer UI
#
# Required Environment Variables:
#   SPOOLED_API_KEY         - Your Spooled API key
#   CLOUDFLARE_TUNNEL_TOKEN - Cloudflare tunnel token
#
# Optional Environment Variables:
#   SPRITEFORGE_IMAGE       - Docker image (default: ghcr.io/spooled-cloud/spooled-example-spriteforge:latest)
#   SPOOLED_BASE_URL        - Backend API URL
#   SPOOLED_WS_URL          - WebSocket URL
#   SOURCE_COMMIT / IMAGE_DIGEST - optional /health identity overrides only;
#     leave unset so CI-baked image SOURCE_COMMIT is visible
#
# Cloudflare Tunnel Routes (configure in Zero Trust dashboard):
#   - example.spooled.cloud -> http://spriteforge:3000

services:
  # ===========================================
  # SpriteForge Application
  # ===========================================
  spriteforge:
    image: ${SPRITEFORGE_IMAGE:-ghcr.io/spooled-cloud/spooled-example-spriteforge:latest}
    container_name: spooled_spriteforge
    restart: unless-stopped
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      # Do NOT set SOURCE_COMMIT here with a default of "unknown".
      # CI bakes SOURCE_COMMIT into the image ENV; composing a default
      # clobbers that bake and /health reports app.commit=unknown.
      # Optional identity overrides (set in Portainer only when needed):
      #   SOURCE_COMMIT, IMAGE_DIGEST

      # Spooled Configuration (Required)
      SPOOLED_API_KEY: ${SPOOLED_API_KEY}
      SPOOLED_BASE_URL: ${SPOOLED_BASE_URL:-https://api.spooled.cloud}
      SPOOLED_WS_URL: ${SPOOLED_WS_URL:-wss://api.spooled.cloud}

      # Queue Names
      QUEUE_FRAMES: ${QUEUE_FRAMES:-spriteforge-frames}
      QUEUE_ASSEMBLE: ${QUEUE_ASSEMBLE:-spriteforge-assemble}
      QUEUE_PUBLIC: ${QUEUE_PUBLIC:-spriteforge-public}

      # Worker Concurrency
      WORKER_CONCURRENCY_FRAMES: ${WORKER_CONCURRENCY_FRAMES:-8}
      WORKER_CONCURRENCY_ASSEMBLE: ${WORKER_CONCURRENCY_ASSEMBLE:-2}
      WORKER_CONCURRENCY_PUBLIC: ${WORKER_CONCURRENCY_PUBLIC:-1}

      # Public Schedule ("Sprite of the Minute")
      ENABLE_PUBLIC_SCHEDULE: ${ENABLE_PUBLIC_SCHEDULE:-true}
      PUBLIC_SCHEDULE_NAME: ${PUBLIC_SCHEDULE_NAME:-spriteforge-public-sprite}
      PUBLIC_SCHEDULE_CRON: ${PUBLIC_SCHEDULE_CRON:-0 * * * * *}
      PUBLIC_SCHEDULE_TIMEZONE: ${PUBLIC_SCHEDULE_TIMEZONE:-UTC}

      # Job Retention (for cleanup)
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - spriteforge-network

  # ===========================================
  # Cloudflare Tunnel (Zero Trust Access)
  # ===========================================
  # Routes traffic to SpriteForge without exposing ports
  # Configure routes in Cloudflare Zero Trust dashboard:
  #   - example.spooled.cloud -> http://spriteforge:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: spooled_spriteforge_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - spriteforge
    networks:
      - spriteforge-network

networks:
  spriteforge-network:
    driver: bridge
