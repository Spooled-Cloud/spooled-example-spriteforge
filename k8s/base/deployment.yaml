apiVersion: apps/v1
kind: Deployment
metadata:
  name: spooled-example-spriteforge
  labels:
    app.kubernetes.io/name: spooled-example-spriteforge
    app.kubernetes.io/component: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spooled-example-spriteforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spooled-example-spriteforge
        app.kubernetes.io/component: example
    spec:
      serviceAccountName: spooled-example-spriteforge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: spriteforge
          image: ghcr.io/spooled-cloud/spooled-example-spriteforge:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: spooled-example-spriteforge-config
            - secretRef:
                name: spooled-example-spriteforge-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
