apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spooled-example-spriteforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spooled-example-spriteforge
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
