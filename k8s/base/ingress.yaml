apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spooled-example-spriteforge
  labels:
    app.kubernetes.io/name: spooled-example-spriteforge
    app.kubernetes.io/component: example
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # SSE needs long read timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - example.spooled.cloud
      secretName: spooled-example-spriteforge-tls
  rules:
    - host: example.spooled.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spooled-example-spriteforge
                port:
                  name: http
