apiVersion: v1
kind: ConfigMap
metadata:
  name: spooled-example-spriteforge-config
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3000"

  # Spooled endpoints
  SPOOLED_BASE_URL: "https://api.spooled.cloud"
  SPOOLED_WS_URL: "wss://api.spooled.cloud"

  # Queues used by this demo
  QUEUE_FRAMES: "spriteforge-frames"
  QUEUE_ASSEMBLE: "spriteforge-assemble"
  QUEUE_PUBLIC: "spriteforge-public"

  # Schedule (Sprite of the Minute)
  ENABLE_PUBLIC_SCHEDULE: "true"
  PUBLIC_SCHEDULE_NAME: "spriteforge-public-sprite"
  PUBLIC_SCHEDULE_CRON: "0 * * * * *"
  PUBLIC_SCHEDULE_TIMEZONE: "UTC"

  # Worker concurrency
  WORKER_CONCURRENCY_FRAMES: "8"
  WORKER_CONCURRENCY_ASSEMBLE: "2"
  WORKER_CONCURRENCY_PUBLIC: "1"

  # Job retention (hours until demo jobs expire)
  JOB_RETENTION_HOURS: "24"

  # Proxy, live connections, worker ids (the app's own defaults; blank = default)
  # TRUST_PROXY: on behind the ingress; "false" if the pod is reachable directly.
  TRUST_PROXY: "true"
  # SSE streams per process / per client IP (per-IP is generous: shared NAT).
  MAX_SSE_CLIENTS: "500"
  MAX_SSE_PER_IP: "30"
  # Blank = spriteforge-<hash of the API key> (worker ids are global across
  # organizations). One replica per prefix.
  WORKER_ID_PREFIX: ""
  # Ms running jobs may finish after SIGTERM (Kubernetes waits 30 s).
  WORKER_SHUTDOWN_TIMEOUT_MS: "20000"
