# ═══════════════════════════════════════════════════════════════════════════
# SpriteForge Docker Compose
# For local development and testing
# ═══════════════════════════════════════════════════════════════════════════
#
# Usage:
#   cp .env.example .env
#   # Edit .env with your SPOOLED_API_KEY
#   docker compose up --build
#
# ═══════════════════════════════════════════════════════════════════════════

version: "3.8"

services:
  spriteforge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Required
      - SPOOLED_API_KEY=${SPOOLED_API_KEY}

      # Optional - Spooled endpoints
      - SPOOLED_BASE_URL=${SPOOLED_BASE_URL:-https://api.spooled.cloud}
      - SPOOLED_WS_URL=${SPOOLED_WS_URL:-wss://api.spooled.cloud}

      # Optional - Server config
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=0.0.0.0
      - PORT=3000
      - SOURCE_COMMIT=${SOURCE_COMMIT:-local}
      - IMAGE_DIGEST=${IMAGE_DIGEST:-}

      # Optional - Queue names
      - QUEUE_FRAMES=${QUEUE_FRAMES:-spriteforge-frames}
      - QUEUE_ASSEMBLE=${QUEUE_ASSEMBLE:-spriteforge-assemble}
      - QUEUE_PUBLIC=${QUEUE_PUBLIC:-spriteforge-public}

      # Optional - Worker concurrency
      - WORKER_CONCURRENCY_FRAMES=${WORKER_CONCURRENCY_FRAMES:-8}
      - WORKER_CONCURRENCY_ASSEMBLE=${WORKER_CONCURRENCY_ASSEMBLE:-2}
      - WORKER_CONCURRENCY_PUBLIC=${WORKER_CONCURRENCY_PUBLIC:-1}

      # Optional - Public schedule
      - ENABLE_PUBLIC_SCHEDULE=${ENABLE_PUBLIC_SCHEDULE:-true}
      - PUBLIC_SCHEDULE_NAME=${PUBLIC_SCHEDULE_NAME:-spriteforge-public-sprite}
      - PUBLIC_SCHEDULE_CRON=${PUBLIC_SCHEDULE_CRON:-0 * * * * *}
      - PUBLIC_SCHEDULE_TIMEZONE=${PUBLIC_SCHEDULE_TIMEZONE:-UTC}

      # Optional - Job retention (for cleanup)
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}

      # Optional - Proxy, live connections, worker ids (blank = app default)
      # TRUST_PROXY defaults to on; set false/0/no/off when this port is
      # reachable without a proxy in front.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # SSE streams per process / per client IP (defaults 500 / 30; the per-IP
      # cap is generous because many visitors share one NAT address).
      - MAX_SSE_CLIENTS=${MAX_SSE_CLIENTS:-}
      - MAX_SSE_PER_IP=${MAX_SSE_PER_IP:-}
      # Blank = spriteforge-<hash of the API key>; one replica per prefix.
      - WORKER_ID_PREFIX=${WORKER_ID_PREFIX:-}
      # Ms running jobs may finish after SIGTERM (default 20000).
      - WORKER_SHUTDOWN_TIMEOUT_MS=${WORKER_SHUTDOWN_TIMEOUT_MS:-}

    restart: unless-stopped

    # Docker stops a container after 10 s by default; the app drains running
    # jobs for up to 20 s on SIGTERM, so give it 30 s (as Kubernetes does).
    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
